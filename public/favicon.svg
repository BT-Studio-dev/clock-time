<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bt-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7eb8e8" />
      <stop offset="100%" stop-color="#ffd166" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0716" />
  <circle cx="32" cy="32" r="23" stroke="url(#bt-ring)" stroke-width="3" fill="none" opacity="0.9" filter="url(#glow)" />
  <circle cx="32" cy="32" r="23" stroke="url(#bt-ring)" stroke-width="2.5" fill="none" opacity="0.95" />
  <!-- Clock ticks -->
  <line x1="32" y1="12" x2="32" y2="15" stroke="#ffd166" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="49" x2="32" y2="52" stroke="#7eb8e8" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="32" x2="15" y2="32" stroke="#7eb8e8" stroke-width="2" stroke-linecap="round" />
  <line x1="49" y1="32" x2="52" y2="32" stroke="#ffd166" stroke-width="2" stroke-linecap="round" />
  <!-- Center & hands -->
  <circle cx="32" cy="32" r="2.5" fill="#ffd166" />
  <line x1="32" y1="32" x2="32" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="42" y2="32" stroke="#ffd166" stroke-width="2" stroke-linecap="round" />
</svg>
